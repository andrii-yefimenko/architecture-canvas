services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: architecture-canvas:latest
    container_name: architecture-canvas
    ports:
      - '3000:3000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
